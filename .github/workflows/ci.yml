name: CI

# Single workflow for checks and releases:
# - pull_request / manual run: checks only
# - push of a v* tag: checks, then publishes to crates.io
on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release half-way through.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --lib

  msrv:
    name: Check MSRV (1.99.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Check
        run: cargo check --lib

  verify-release:
    name: Verify release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [test, msrv]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Check tag matches Cargo.toml version
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "uad-macros") | .version')"
          echo "Tag version:   ${tag_version}"
          echo "Crate version: ${crate_version}"
          if [ "${tag_version}" != "${crate_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the Cargo.toml version ${crate_version}. Bump Cargo.toml and re-tag."
            exit 1
          fi

      - name: Verify the package builds
        run: cargo package

  publish:
    name: Publish to crates.io
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify-release
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/uad-macros
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check crates.io token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::The CARGO_REGISTRY_TOKEN secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
